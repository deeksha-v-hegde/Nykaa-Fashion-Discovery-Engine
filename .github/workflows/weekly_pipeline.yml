name: Nykaa Discovery Engine — Weekly Research Run

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly_research_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Phase 10 Weekly Incremental Research Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          python -m phase10.run_phase10

      - name: Commit Updated DB Snapshot and Evolution Logs
        run: |
          git config --global user.name "Nykaa Discovery Bot"
          git config --global user.email "discovery-bot@nykaa.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: Weekly Monday Research Run update [$(date -u +'%Y-%m-%d')]"
          git push
